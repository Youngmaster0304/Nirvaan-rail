# ============================================================================
# SIH26027 — AI-Powered Automatic Block Planning System
# Docker Compose — Full Stack Deployment
# ============================================================================
# Usage:
#   docker-compose up --build        # Build and start all services
#   docker-compose up -d             # Start in background
#   docker-compose down              # Stop all services
#   docker-compose logs -f backend   # Follow backend logs
# ============================================================================

version: '3.9'

services:
  # --------------------------------------------------------------------------
  # Backend: FastAPI + LightGBM + OR-Tools + NetworkX
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih26027-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/block_planning.db
      - SECRET_KEY=sih26027-hackathon-secret-key-change-in-production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
      - PYTHONUNBUFFERED=1
      - APP_NAME=SIH26027 AI Block Planning System
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - sih-network

  # --------------------------------------------------------------------------
  # Frontend: React + TypeScript Government Portal
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih26027-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sih-network

  # --------------------------------------------------------------------------
  # Development Frontend (Vite dev server with hot reload)
  # Use this for development instead of the production frontend
  # Run with: docker-compose up backend frontend-dev
  # --------------------------------------------------------------------------
  frontend-dev:
    image: node:20-alpine
    container_name: sih26027-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    profiles:
      - dev
    networks:
      - sih-network

volumes:
  backend-data:
    driver: local
  frontend-node-modules:
    driver: local

networks:
  sih-network:
    driver: bridge
    name: sih26027-network
